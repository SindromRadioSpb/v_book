[pytest]
testpaths = tests
addopts = -ra
markers =
    unit: fast unit-level checks
    integration: integration tests touching multiple layers
    smoke: smoke scenarios (separate gate)
    env: requires explicit environment inputs/artifacts
    serial: must run in a single worker/process
    requires_stanza: tests requiring Stanza Hebrew model (tokenize, pos, lemma); skip if stanza not installed or he/ model not downloaded
