[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hdle-premium"
version = "1.0.1"
description = "Hebraic Dynamic Lexicon Engine - Premium Edition"
requires-python = ">=3.11"
dependencies = [
    "PyQt6>=6.6.0",
    "SQLAlchemy>=2.0.0",
    "python-docx>=1.1.0",
    "python-pptx>=0.6.21",  # For PowerPoint (.pptx) import
    "PyPDF2>=3.0.0",
    "stanza>=1.7.0",
    "openpyxl>=3.1.0",
    "pandas>=2.0.0",
    "psutil>=5.9.0",  # For process lock stale detection
    "cryptography>=41.0.0",  # For AES-256-GCM credential encryption
    "keyring>=24.0.0",  # For OS keyring credential storage
    "deep-translator>=1.11.4",  # For Google Translate free tier (M11)
    "google-cloud-translate==3.15.3",  # For Google Cloud Translation API v3 (Official)
    "google-auth==2.28.2",  # For Google Cloud service account authentication
    # Optional OCR dependencies
    # "pytesseract>=0.3.10",
    # "pdf2image>=1.16.0",
]

[project.optional-dependencies]
ocr = [
    "pytesseract>=0.3.10",
    "pdf2image>=1.16.0",
]
audio_local = [
    "torch>=2.2.0",
    "transformers>=4.40.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-qt>=4.2.0",
    "black>=23.0.0",
    "freezegun>=1.4.0",  # For deterministic datetime in tests
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear (likely bugs)
    "UP",  # pyupgrade (modernize syntax)
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",   # line too long — handled by black
    "B008",   # do not perform function call in default arguments
    "SIM108", # ternary operator — can reduce readability in complex cases
    "SIM110", # any() refactor — reduces clarity in multi-condition loops
]
exclude = ["tests/*", "scripts/*", "*.spec"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_return_any = false
# Legacy adoption mode: don't require annotations on every function yet
# Tighten gradually as new code is written with full type hints.
no_implicit_optional = false    # existing code: str = None patterns
warn_unused_ignores = false     # reduces noise from existing # type: ignore
allow_untyped_defs = true       # don't fail on unannotated legacy functions
# PyQt6 UI layer: f-string backslash syntax (Python 3.12+, pre-existing)
exclude = ["tests/", "scripts/", "app/ui/"]

[[tool.mypy.overrides]]
module = ["PyQt6.*", "stanza.*", "deep_translator.*", "google.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# f-string with backslash — Python 3.12+ syntax, pre-existing in this file
module = "app.ui.models_qt"
ignore_errors = true

[[tool.mypy.overrides]]
# services/* и infra/* — baseline pre-existing type errors.
# Постепенно убирать файлы из этого списка по мере починки типов.
# Tracked real bug: app.infra.db_retry (tuple vs list, .append на tuple).
module = ["app.services.*", "app.infra.*"]
ignore_errors = true

[[tool.mypy.overrides]]
# domain — проверяется строго. Только эти файлы с known pre-existing issues.
module = [
    "app.domain.sentence_splitter",
    "app.domain.term_extraction.np_extractor",
    "app.domain.term_extraction.ngram_extractor",
    "app.domain.normalization.normalizer",
]
ignore_errors = true
