[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hdle-premium"
version = "1.1.0"
description = "Hebraic Dynamic Lexicon Engine - Premium Edition"
requires-python = ">=3.11"
dependencies = [
    "PyQt6>=6.6.0",
    "SQLAlchemy>=2.0.0",
    "python-docx>=1.1.0",
    "python-pptx>=0.6.21",  # For PowerPoint (.pptx) import
    "PyPDF2>=3.0.0",
    "stanza>=1.7.0",
    "openpyxl>=3.1.0",
    "pandas>=2.0.0",
    "psutil>=5.9.0",  # For process lock stale detection
    "cryptography>=41.0.0",  # For AES-256-GCM credential encryption
    "keyring>=24.0.0",  # For OS keyring credential storage
    "deep-translator>=1.11.4",  # For Google Translate free tier (M11)
    "google-cloud-translate==3.15.3",  # For Google Cloud Translation API v3 (Official)
    "google-auth==2.28.2",  # For Google Cloud service account authentication
    # Optional OCR dependencies
    # "pytesseract>=0.3.10",
    # "pdf2image>=1.16.0",
]

[project.optional-dependencies]
ocr = [
    "pytesseract>=0.3.10",
    "pdf2image>=1.16.0",
]
audio_local = [
    "torch>=2.2.0",
    "transformers>=4.40.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-qt>=4.2.0",
    "black>=23.0.0",
    "freezegun>=1.4.0",  # For deterministic datetime in tests
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.black]
line-length = 100
target-version = ["py311"]
