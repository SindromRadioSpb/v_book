[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hdle-premium"
version = "1.0.0"
description = "Hebraic Dynamic Lexicon Engine - Premium Edition"
requires-python = ">=3.11"
dependencies = [
    "PyQt6>=6.6.0",
    "SQLAlchemy>=2.0.0",
    "python-docx>=1.1.0",
    "PyPDF2>=3.0.0",
    "stanza>=1.7.0",
    "openpyxl>=3.1.0",
    "pandas>=2.0.0",
    "psutil>=5.9.0",  # For process lock stale detection
    # Optional OCR dependencies
    # "pytesseract>=0.3.10",
    # "pdf2image>=1.16.0",
]

[project.optional-dependencies]
ocr = [
    "pytesseract>=0.3.10",
    "pdf2image>=1.16.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-qt>=4.2.0",
    "black>=23.0.0",
    "freezegun>=1.4.0",  # For deterministic datetime in tests
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.black]
line-length = 100
target-version = ["py311"]
