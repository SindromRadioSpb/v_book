name: CI - M7 + P1 Gate

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PyQt6 SQLAlchemy stanza spacy
        python -m spacy download en_core_web_sm

    - name: Set QT platform for headless (Linux)
      if: runner.os == 'Linux'
      run: echo "QT_QPA_PLATFORM=offscreen" >> $GITHUB_ENV

    - name: Run M7 tests
      run: |
        python test_m7.py
        python test_m7_ui_integration.py
        python test_m7_normalization.py

    - name: Run P1 unit tests
      run: python test_p1_verification.py

    - name: Run P1 E2E tests (term clusters)
      run: python test_p1_e2e_termclusters.py

    - name: Upload test artifacts
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: test-reports-${{ matrix.os }}-py${{ matrix.python-version }}
        path: |
          runtime/
          *.log
        retention-days: 7
